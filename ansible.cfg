# ansible-lab/ansible.cfg
# Ansible configuration file.
# Ansible looks for this file in the current directory first,
# then ~/.ansible.cfg, then /etc/ansible/ansible.cfg.
# By putting it here, anyone who clones this repo gets the
# correct settings automatically without touching their system.
#
# Every setting here has a default — this file only overrides
# the ones we actually care about for this lab.

[defaults]

# inventory = where Ansible looks for the hosts file.
# Without this, Ansible looks at /etc/ansible/hosts (the global
# system default). Pointing it here keeps everything self-contained.
inventory = inventory/hosts.yml

# roles_path = where Ansible looks for roles when you reference
# them by name in a playbook.
# "roles" = look in the ./roles/ folder next to site.yml.
roles_path = roles

# host_key_checking = whether Ansible verifies SSH host keys.
# False here because we are connecting to localhost, not a remote
# server — there is no SSH key to check.
# In production against real servers, set this to True.
host_key_checking = False

# retry_files_enabled = whether Ansible writes a .retry file
# listing failed hosts when a playbook fails.
# Disabled here to keep the working directory clean during the lab.
retry_files_enabled = False

# stdout_callback = how Ansible formats its output.
# "yaml" produces clean, readable output with proper indentation.
# The default "minimal" is harder to read for learning purposes.
stdout_callback = yaml

[privilege_escalation]
# become = whether to escalate privileges by default.
# True here means every play runs as root (via sudo) unless
# a specific task overrides it with become: false.
become = True

# become_method = how to escalate (sudo, su, pbrun, etc.).
# sudo is the standard method on Kali and Debian-family systems.
become_method = sudo

# become_user = which user to escalate to.
# root = full system access required for hardening tasks.
become_user = root
