---
# roles/hardening/tasks/fail2ban.yml
# Configures fail2ban with an SSH jail.
# fail2ban watches /var/log/auth.log for repeated SSH failures
# and automatically bans the offending IP via iptables/ufw.
# This works alongside the SSH MaxAuthTries setting -- SSH disconnects
# quickly, fail2ban bans the IP so it cannot keep reconnecting.

- name: Write fail2ban SSH jail configuration
  ansible.builtin.template:
    # template module reads a Jinja2 (.j2) file from the role's
    # templates/ directory, substitutes all {{ variable }} references
    # using values from vars/main.yml, and writes the rendered result
    # to the destination path on the target machine.
    #
    # This replaces the old copy+content approach. The config now lives
    # in templates/ssh_jail.conf.j2 where it is easy to read and edit
    # without touching any task YAML.
    src: ssh_jail.conf.j2
    # Ansible automatically looks in roles/hardening/templates/ for this.
    # You do not need to write a full path -- just the filename.
    dest: /etc/fail2ban/jail.d/ssh.conf
    # jail.d/ is the directory for per-service jail config files.
    # fail2ban reads all .conf files here and merges them.
    # Putting our SSH jail here (not in jail.conf) means we do not
    # overwrite fail2ban's default configuration -- we add on top of it.
    owner: root
    group: root
    mode: "0644"

  notify: Restart fail2ban
  # Restart fail2ban so it picks up the new jail config.

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
