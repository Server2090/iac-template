---
# inventory/hosts.yml
# The inventory file is Ansible's list of machines to manage.
# Without an inventory, Ansible does not know what to connect to.

all:
  hosts:
    192.168.10.21:
      # ansible_host is the IP Ansible will SSH into.
      ansible_host: 192.168.10.21

      # ansible_user is the SSH username Ansible logs in as.
      ansible_user: kali

      # ansible_ssh_private_key_file tells Ansible exactly which
      # private key file to use for SSH authentication.
      # This must be the private key (no .pub extension).
      # Without this, Ansible tries your default key (~/.ssh/id_rsa
      # or id_ed25519) which won't work since we made a named key.
      ansible_ssh_private_key_file: /home/server/.ssh/ansible_iac_test_kali

      # ansible_become: true tells Ansible to escalate to root
      # via sudo after connecting. Needed for tasks that write
      # to /etc/ or manage system services.
      ansible_become: true

      # ansible_become_method: sudo is the default but stated
      # explicitly here so the file is self-documenting.
      ansible_become_method: sudo

      # ansible_python_interpreter tells Ansible which Python
      # binary to use on the TARGET machine.
      # auto_silent = detect automatically without printing warnings.
      ansible_python_interpreter: auto_silent
