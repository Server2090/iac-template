---
# ansible-lab/inventory/hosts.yml
# The inventory file is Ansible's list of machines to manage.
# Without an inventory, Ansible does not know what to connect to.
#
# In a real environment this would list remote servers by IP.
# In this lab we only target localhost — the machine we are
# sitting at — so no SSH or network setup is required.

all:
  hosts:
    localhost:
      # ansible_connection: local tells Ansible to skip SSH entirely
      # and run tasks directly on this machine using the local shell.
      # This is the correct method for targeting localhost.
      # Using "ssh" connection to localhost works but is unnecessarily
      # complex and requires SSH keys to be configured.
      ansible_connection: local

      # ansible_python_interpreter tells Ansible exactly which Python
      # binary to use on the target machine.
      # "auto_silent" = detect it automatically without printing a
      # warning message in the output. Without this, Ansible sometimes
      # picks the wrong Python version on Kali and prints noisy warnings.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
